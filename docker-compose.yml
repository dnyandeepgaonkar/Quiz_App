
services:
  server:
    build: ./server
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_BASE_URL: /api/v1
    ports:
      - "3000:80"
    depends_on:
      - server
    env_file:
      - ./client/.env
    restart: unless-stopped
